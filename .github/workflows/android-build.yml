name: Build Android App

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js Setup ──────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # ── Install Dependencies ───────────────────────────────────────────────
      - name: Install Dependencies
        run: npm install

      # ── Build Vite Web App ─────────────────────────────────────────────────
      - name: Build Web App
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ONESIGNAL_APP_ID: ${{ secrets.VITE_ONESIGNAL_APP_ID }}
          VITE_PAYSTACK_PUBLIC_KEY: ${{ secrets.VITE_PAYSTACK_PUBLIC_KEY }}
          VITE_ZEGO_APP_ID: ${{ secrets.VITE_ZEGO_APP_ID }}
          VITE_ZEGO_SERVER_SECRET: ${{ secrets.VITE_ZEGO_SERVER_SECRET }}
          VITE_REVENUECAT_ANDROID_KEY: ${{ secrets.VITE_REVENUECAT_ANDROID_KEY }}
        run: |
          npm run build
          echo "✅ Vite build complete. Contents of dist/:"
          ls -la dist/

      # ── Java 17 Setup ──────────────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # ── Generate Upload Keystore ───────────────────────────────────────────
      - name: Generate Upload Keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/upload-keystore.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias collegedate \
            -dname "CN=TheCollegeDate, OU=Mobile, O=CollegeDate, L=Lagos, S=Lagos, C=NG" \
            -storepass Collegedate123 \
            -keypass Collegedate123
          echo "✅ Keystore generated"

      # ── Capacitor: Copy web assets into Android ────────────────────────────
      - name: Capacitor Copy
        run: |
          echo "Running cap copy..."
          npx cap copy android --verbose 2>&1 || true
          echo "Verifying assets were copied:"
          ls -la android/app/src/main/assets/public/ || echo "Assets dir not found"

      # ── Capacitor: Sync plugins ────────────────────────────────────────────
      - name: Capacitor Sync
        run: |
          echo "Running cap sync..."
          npx cap sync android --verbose 2>&1
          echo "✅ cap sync complete"

      # ── Cache Gradle ───────────────────────────────────────────────────────
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # ── Make gradlew executable ────────────────────────────────────────────
      - name: Make gradlew executable
        run: chmod +x android/gradlew

      # ── Build Release AAB ──────────────────────────────────────────────────
      - name: Build Release AAB
        env:
          KEYSTORE_PATH: upload-keystore.jks
          KEYSTORE_STORE_PASSWORD: Collegedate123
          KEYSTORE_KEY_ALIAS: collegedate
          KEYSTORE_KEY_PASSWORD: Collegedate123
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --stacktrace 2>&1

      # ── Upload AAB Artifact ────────────────────────────────────────────────
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # ── Upload Keystore Artifact ───────────────────────────────────────────
      - name: Upload Keystore Artifact (KEEP SAFE)
        uses: actions/upload-artifact@v4
        with:
          name: upload-keystore-jks
          path: android/app/upload-keystore.jks
          retention-days: 30
